name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # The habit engine is pure (no storage, no network, no DOM), so the whole
      # streak/grace/leaderboard model is testable with node built-ins alone.
      - run: npm test

  # Everything the engine tests structurally cannot reach: dom.js's rendering and app.js's click
  # handlers, against ?demo=1 (a real event log through the real engine, no IndexedDB, every write
  # refused with a banner). See playwright.config.mjs's header comment for why this is separate.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Upload Playwright report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
