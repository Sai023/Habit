name: secret-scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # scan full history, not just the diff, so a secret buried in an old commit still fails a later PR that touches nearby lines

      # The plain OSS gitleaks CLI (MIT-licensed), not the gitleaks/gitleaks-action wrapper — that
      # wrapper requires a paid GITLEAKS_LICENSE for any PRIVATE repo, which two of this project's
      # three repos are (Passport, PauseApp — this one, Habit, is the public one). The CLI has no
      # such restriction on either visibility, so this one workflow works unmodified everywhere.
      - name: Install gitleaks
        run: |
          url=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest \
            | grep browser_download_url | grep linux_x64.tar.gz | cut -d '"' -f 4)
          curl -sSL "$url" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      # js/config.js documents that the Supabase anon/publishable key is meant to be public and
      # safe to commit — this exists to catch the OTHER key, the service_role secret, if it's
      # ever pasted into the same file by mistake.
      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose
