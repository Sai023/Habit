name: secret-scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan full history, not just the diff, so a secret buried in an old commit still fails a later PR that touches nearby lines

      # Free for public repos with no license key. js/config.js documents that the Supabase
      # anon/publishable key is meant to be public — this exists to catch the OTHER key, the
      # service_role secret, if it's ever pasted into the same file by mistake.
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
