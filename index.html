<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <title>Goal Buddy</title>
  <meta name="description" content="Group habit tracking for a close-knit group of friends." />

  <meta name="theme-color" content="#0B1021" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="color-scheme" content="dark" />

  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div id="app" class="app"></div>
  <noscript class="noscript">Goal Buddy needs JavaScript enabled.</noscript>
  <script type="module" src="./js/app.js"></script>

  <script>
    // Offline shell. Deliberately non-fatal: a registration that fails must never stop the app
    // loading, it just runs online-only. Matters most embedded in Pause, where every other tab
    // works without a connection and this one would otherwise show a blank page.
    if ("serviceWorker" in navigator) {
      addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
