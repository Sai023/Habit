<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex">
  <title>Goal Buddy · class</title>
  <!--
    The player page. One iframe, black, edge to edge, and nothing else — no bridge, no app code.

    This page exists because a YouTube embed has to arrive from a page with an origin: opened bare,
    or from a page with no address, the player answers "configuration error (153)". The shell
    opens THIS page in Chrome, over the app, from the app's own origin, with the video's id in
    the query — and the iframe inside it is then an ordinary embed on an ordinary site, which is
    what YouTube is checking for. `t` is the class's title, for the tab's toolbar.

    The id is checked to the shape of a YouTube id before it goes anywhere near the frame.

    No autoplay, on purpose. It was tried: at a mobile user agent — a WebView is one — a player
    asked to autoplay renders NOTHING, not even its poster; the mobile autoplay policy blocks it
    and the player gives up quietly. Without it the poster and the play button draw, and one tap
    starts the class. Tested on this page at a phone-sized, mobile-UA browser.
  -->
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    .back { position: absolute; left: 0; right: 0; bottom: 0; margin: 0; padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
      color: #9AA6C9; font: 13px system-ui, sans-serif; text-align: center; pointer-events: none; }
    .no { position: absolute; inset: 0; display: grid; place-items: center; color: #9AA6C9; font: 15px system-ui, sans-serif; }
  </style>
</head>
<body>
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var id = q.get("v") || "";
      var t = q.get("t") || "";
      if (t) document.title = t;
      if (!/^[A-Za-z0-9_-]{11}$/.test(id)) {
        var p = document.createElement("p");
        p.className = "no";
        p.textContent = "No video.";
        document.body.append(p);
        return;
      }
      var f = document.createElement("iframe");
      f.src = "https://www.youtube-nocookie.com/embed/" + id + "?playsinline=1&rel=0&modestbranding=1";
      f.title = "Class";
      f.allow = "accelerometer; encrypted-media; gyroscope; picture-in-picture; fullscreen";
      f.allowFullscreen = true;
      document.body.append(f);
      var back = document.createElement("p");
      back.className = "back";
      back.textContent = "When you're done, close this tab (✕) and mark the class in Goal Buddy.";
      document.body.append(back);
    })();
  </script>
</body>
</html>
